<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M32 4L10 14V30C10 44.5 19.5 55.5 32 60C44.5 55.5 54 44.5 54 30V14L32 4Z" 
        fill="#0B0F19" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Inner Shield Core -->
  <path d="M32 10L16 18V29C16 40.5 23 49 32 53C41 49 48 40.5 48 29V18L32 10Z" 
        fill="url(#shieldGrad)" fill-opacity="0.2" stroke="url(#shieldGrad)" stroke-width="1.5" />

  <!-- AI Pulse Node Vector -->
  <circle cx="32" cy="24" r="5" fill="#38BDF8" filter="url(#glow)" />
  <path d="M22 36L32 24L42 36" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="36" r="3.5" fill="#818CF8" />
  <circle cx="42" cy="36" r="3.5" fill="#818CF8" />
  <path d="M32 29V44" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="45" r="3" fill="#38BDF8" />
</svg>